server {
    server_name foodgramm.servehttp.com;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000/admin/;
    }

    location /media/ {
        alias /var/lib/docker/volumes/infra_media/_data/;
    }

    location /static/admin/ {
        alias /var/lib/docker/volumes/infra_static/_data/admin/;
    }

    location /static/rest_framework/ {
        alias /var/lib/docker/volumes/infra_static/_data/rest_framework/;
    }

    # React static
    location /static/ {
        alias /var/lib/docker/volumes/infra_static/_data/static/;
    }

    # React app
    location / {
        root /var/lib/docker/volumes/infra_static/_data;
        index index.html;
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/foodgramm.servehttp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/foodgramm.servehttp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    server_name foodgramm.servehttp.com;
    return 301 https://$host$request_uri;
}
