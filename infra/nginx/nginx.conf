server {
    listen 80;

    location /api/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/admin/;
    }

    location /media/ {
        alias /media/;
    }

    # Django static
    location /static/rest_framework/ {
        alias /static/rest_framework/;
    }

    location /static/admin/ {
        alias /static/admin/;
    }

    # React static
    location /static/ {
        alias /static/static/;
    }

    # Frontend
    location / {
        root /static;
        try_files $uri /index.html;
    }
}