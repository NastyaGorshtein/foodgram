volumes:
  pg_data:
  static:
  media:

services:

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: nastyagorshtein/foodgram_backend:latest
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/app/static/
      - media:/app/media/
    container_name: backend

  frontend:
    image: nastyagorshtein/foodgram_frontend:latest
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static/

  gateway:
    image: nastyagorshtein/foodgram_gateway
    ports:
      - "8080:80"
    volumes:
      - static:/static/
      - media:/media/
    depends_on:
      backend:
        condition: service_started